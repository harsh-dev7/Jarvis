<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jarvis Online</title>
<style>
    body {
        background: #0e0e0e;
        color: white;
        text-align: center;
        font-family: Arial;
        padding-top: 50px;
    }
    h1 {
        font-size: 40px;
        color: #1e90ff;
    }
    #status {
        margin-top: 20px;
        font-size: 20px;
    }
</style>
</head>
<body>

<h1>JARVIS ONLINE</h1>
<p id="status">Click anywhere to activate Jarvis…</p>

<script>
let recognition;
let active = false;

function setupRecognition() {
    recognition = new webkitSpeechRecognition();
    recognition.lang = "en-US";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = () => {
        document.getElementById("status").innerText = "Listening...";
    };

    recognition.onerror = () => {
        document.getElementById("status").innerText = "Error occurred. Restarting…";
        restartListening();
    };

    recognition.onend = () => {
        restartListening();  // Auto restart after completion
    };

    recognition.onresult = function(event) {
        let command = event.results[0][0].transcript;
        document.getElementById("status").innerText = "You said: " + command;
        sendCommand(command);
    };
}

function restartListening() {
    if (active) {
        setTimeout(() => recognition.start(), 400);
    }
}

function sendCommand(command) {
    fetch("/process", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ command })
    })
    .then(res => res.json())
    .then(data => {
        speak(data.reply);

        if (data.action === "open_url") {
            window.open(data.url, "_blank");
        }
    });
}

function speak(text) {
    let msg = new SpeechSynthesisUtterance(text);
    window.speechSynthesis.speak(msg);
}

// 🔥 Auto-start listening AFTER first user click (browser rule)
window.addEventListener("click", () => {
    if (!active) {
        active = true;
        setupRecognition();
        recognition.start();
        document.getElementById("status").innerText = "Activating… Listening now.";
    }
});
</script>

</body>
</html>
