<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Auto Voice Assistant</title>

    <style>
        body {
            background: #0d0a20;
            color: white;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .box {
            width: 90%;
            max-width: 600px;
            background: #1b1734;
            padding: 20px;
            border-radius: 12px;
        }
        #chat {
            height: 300px;
            overflow-y: auto;
            background: #000;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .msg {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
        }
        .you {
            background: #5836ff;
            text-align: right;
        }
        .jarvis {
            background: #292347;
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>🤖 JARVIS Auto Voice Assistant</h2>
        <div id="chat"></div>
        <!-- No buttons, no keyboard, fully automatic -->
    </div>

<script>
    const chat = document.getElementById("chat");

    function addMessage(text, sender) {
        const msg = document.createElement("div");
        msg.className = `msg ${sender}`;
        msg.textContent = text;
        chat.appendChild(msg);
        chat.scrollTop = chat.scrollHeight;
    }

    // LOAD GREETING FIRST
    window.onload = async () => {
        const res = await fetch("http://localhost:5000/api/greeting");
        const data = await res.json();
        addMessage(data.greeting, "jarvis");

        // START auto voice loop after greeting
        startVoiceLoop();
    };

    // MAIN AUTO VOICE LOOP
    async function startVoiceLoop() {
        while (true) {
            addMessage("🎤 Listening...", "jarvis");

            const listen = await fetch("http://localhost:5000/api/listen", {
                method: "POST"
            });

            const heard = await listen.json();

            if (heard.status === "success") {
                addMessage(heard.query, "you");

                const res = await fetch("http://localhost:5000/api/command", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query: heard.query })
                });

                const reply = await res.json();
                addMessage(reply.message, "jarvis");
            } else {
                addMessage("Didn't catch that. Listening again...", "jarvis");
            }
        }
    }
</script>

</body>
</html>
